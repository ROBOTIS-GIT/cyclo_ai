name: Offline plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise contributor setup
        run: npm run setup -- --dev
      - run: npm run doctor -- --hardware-deps
      - run: npm run format:check
        if: runner.os != 'Windows'
      - run: npm run format:python:check
        if: runner.os != 'Windows'
      - run: npm test
        if: runner.os != 'Windows'
      - name: Run Windows integration and runtime tests
        if: runner.os == 'Windows'
        run: node --test tests/integration.test.mjs tests/python-runtime.test.mjs
      - name: Build source archive with a local virtual environment present
        run: npm run package
      - name: Test extracted release bytes
        if: runner.os != 'Windows'
        run: node scripts/python.mjs validation/verify_archive.py artifacts/cyclo-ai-0.2.0.zip
        env:
          CYCLO_PRODUCTS_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Build install archive with pinned runtime libraries
        run: npm run package:runtime
      - name: Verify install archive without dependency installation
        run: npm run verify:runtime -- artifacts/cyclo-ai-0.2.0-install.zip
      - name: Record release archive checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          directory = Path('artifacts')
          archives = sorted(directory.glob('cyclo-ai-*.zip'))
          assert len(archives) == 2, 'Expected source and install ZIPs'
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in archives)
          (directory / 'SHA256SUMS').write_bytes(checksums.encode('utf-8'))
      - uses: actions/upload-artifact@v4
        with:
          name: cyclo-ai-packages-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/cyclo-ai-0.2.0.zip
            artifacts/cyclo-ai-0.2.0-install.zip
            artifacts/SHA256SUMS
            artifacts/package-result.json
            artifacts/extracted-test-results.json
            artifacts/runtime-package-result.json
            artifacts/runtime-test-results.json
      - name: Print failed test details
        if: failure()
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding='utf-8')
          logs = list(Path('validation/current').glob('*.txt'))
          logs += [Path('artifacts/extracted-test-results.json'), Path('artifacts/runtime-test-results.json')]
          for path in logs:
              if path.is_file():
                  print(f'::group::{path}')
                  print(path.read_text(encoding='utf-8', errors='replace'))
                  print('::endgroup::')
