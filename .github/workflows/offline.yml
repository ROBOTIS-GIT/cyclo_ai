name: Offline plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise contributor setup
        run: npm run setup -- --dev
      - run: npm run doctor -- --hardware-deps
      - run: npm run format:check
        if: runner.os != 'Windows'
      - run: npm run format:python:check
        if: runner.os != 'Windows'
      - run: npm test
        if: runner.os != 'Windows'
      - name: Run Windows integration and runtime tests
        if: runner.os == 'Windows'
        run: node --test tests/integration.test.mjs tests/python-runtime.test.mjs
      - name: Print failed test details
        if: failure()
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding='utf-8')
          logs = list(Path('validation/current').glob('*.txt'))
          for path in logs:
              if path.is_file():
                  print(f'::group::{path}')
                  print(path.read_text(encoding='utf-8', errors='replace'))
                  print('::endgroup::')
