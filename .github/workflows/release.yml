name: Release

on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, edited, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: ROBOTIS-GIT/github_workflows/.github/workflows/release.yml@main
    with:
      source_branch: main
      target_branch: release

  packages:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    uses: ./.github/workflows/release-package.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ needs.release.outputs.version }}
      source_commit: ${{ github.event.pull_request.merge_commit_sha }}

  publish-assets:
    needs: [release, packages]
    permissions:
      contents: write
    uses: ./.github/workflows/release-package.yml
    with:
      os: ubuntu-latest
      version: ${{ needs.release.outputs.version }}
      source_commit: ${{ github.event.pull_request.merge_commit_sha }}
      publish: true

  discord-notify:
    needs: [release, publish-assets]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
    uses: ROBOTIS-GIT/github_workflows/.github/workflows/discord-notify.yml@main
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
