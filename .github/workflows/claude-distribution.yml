name: Publish Claude distribution
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version (X.Y.Z)
        required: true
        type: string
      release_run_id:
        description: Successful Release workflow run containing the packages
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: claude-dist
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the published release package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected version X.Y.Z'; exit 1; }
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Expected a numeric release run ID'; exit 1; }
          gh release view "$VERSION" --json tagName,isDraft,isPrerelease | jq -e --arg version "$VERSION" '.tagName == $version and (.isDraft | not) and (.isPrerelease | not)'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" | jq -e '.path == ".github/workflows/release.yml" and .event == "pull_request" and .conclusion == "success"'
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cyclo-ai-packages-$VERSION-ubuntu-latest" --dir artifacts
          (cd artifacts && sha256sum --check SHA256SUMS)
          gh auth setup-git
          git fetch --no-tags origin "refs/tags/$VERSION"
          source_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          recorded_commit=$(tr -d '\r\n' < artifacts/SOURCE_COMMIT)
          test "$source_commit" = "$recorded_commit" || { echo 'Package source does not match the published release tag'; exit 1; }
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run setup -- --dev
      - name: Verify the downloaded install package
        env:
          VERSION: ${{ inputs.version }}
        run: npm run verify:runtime -- "artifacts/cyclo-ai-$VERSION-install.zip"
      - name: Prepare the repository installation tree
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.package.outputs.source_commit }}
        run: |
          node scripts/python.mjs validation/prepare_distribution.py "artifacts/cyclo-ai-$VERSION-install.zip" "$RUNNER_TEMP/claude-package" --source-commit "$SOURCE_COMMIT"
          npm run verify:runtime -- "$RUNNER_TEMP/claude-package/cyclo-ai"
      - name: Sign and publish the distribution branch
        env:
          GNUPGHOME: ${{ runner.temp }}/cyclo-release-gpg
          RELEASE_GPG_PROGRAM: ${{ runner.temp }}/cyclo-gpg-sign
          GH_TOKEN: ${{ github.token }}
          RELEASE_GIT_NAME: ${{ vars.RELEASE_GIT_NAME }}
          RELEASE_GIT_EMAIL: ${{ vars.RELEASE_GIT_EMAIL }}
          RELEASE_GITHUB_LOGIN: ${{ vars.RELEASE_GITHUB_LOGIN }}
          RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          test -n "$RELEASE_GPG_PRIVATE_KEY" || { echo 'Configure the registered release signing key first; no unsigned publishing.'; exit 1; }
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          cat > "$RELEASE_GPG_PROGRAM" <<'SIGNER'
          #!/usr/bin/env bash
          exec gpg --batch --pinentry-mode loopback --passphrase-fd 3 "$@" 3<<<"${RELEASE_GPG_PASSPHRASE:-}"
          SIGNER
          chmod 700 "$RELEASE_GPG_PROGRAM"
          gh auth setup-git
          python scripts/publish-claude.py "$RUNNER_TEMP/claude-package/cyclo-ai"
      - name: Remove temporary signing material
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/cyclo-release-gpg
          RELEASE_GPG_PROGRAM: ${{ runner.temp }}/cyclo-gpg-sign
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf -- "$GNUPGHOME" "$RELEASE_GPG_PROGRAM"
